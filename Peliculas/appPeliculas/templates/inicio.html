<!DOCTYPE html>
<html>
<head>
    <!-- Bootstrap CSS (opcional pero recomendado) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .carousel-item img {
            height: 500px;
            object-fit: cover;
            width: 100%;
        }
        .carousel-caption {
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container mt-4">
    <h2 class="text-center mb-4">Catálogo de Películas</h2>
    
    <!-- Carrusel -->
    <div id="carruselPeliculas" class="carousel slide" data-bs-ride="carousel">
        <!-- Indicadores -->
        <div class="carousel-indicators">
            {% for tipo in tipos %}
                <button type="button" data-bs-target="#carruselPeliculas" 
                        data-bs-slide-to="{{ forloop.counter0 }}" 
                        {% if forloop.first %}class="active"{% endif %}>
                </button>
            {% endfor %}
        </div>

        <!-- Slides -->
        <div class="carousel-inner">
{% for tipo in tipos %}
    <div class="carousel-item {% if forloop.first %}active{% endif %}">
        <a href="{% url 'Peliculas' tipo.id %}" style="text-decoration: none; color: inherit;">
            <img src="/media/{{ tipo.tip_foto }}" 
                 class="d-block w-100" 
                 alt="{{ tipo.tip_nombre }}">

            <div class="carousel-caption d-none d-md-block">
                <h3>{{ tipo.tip_nombre }}</h3>
            </div>
        </a>
    </div>
{% empty %}
    <div class="carousel-item active">
        <div class="alert alert-info text-center">
            No hay tipos de películas disponibles
        </div>
    </div>
{% endfor %}
        </div>

        <!-- Controles -->
        <button class="carousel-control-prev" type="button" 
                data-bs-target="#carruselPeliculas" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
            <span class="visually-hidden">Anterior</span>
        </button>
        <button class="carousel-control-next" type="button" 
                data-bs-target="#carruselPeliculas" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
            <span class="visually-hidden">Siguiente</span>
        </button>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script para control automático (opcional) -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var myCarousel = document.getElementById('carruselPeliculas');
        var carousel = new bootstrap.Carousel(myCarousel, {
            interval: 3000, // Cambia cada 3 segundos
            wrap: true,
            pause: 'hover'
        });
    });
</script>

</body>
</html>
