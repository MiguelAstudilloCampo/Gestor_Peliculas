<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Agregar tipo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />

    <style>
        :root {
            color-scheme: dark;
            --bg: #12121a;
            --card: #1b1b28;
            --card-edge: #262637;
            --field: #14141f;
            --gold: #d4a94f;
            --text: #f1ede3;
            --text-muted: #9c96ab;
            --danger: #c0554a;
            --danger-text: #e2796d;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            background-image:
                radial-gradient(circle at 20% 20%, rgba(212, 169, 79, 0.06), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(212, 169, 79, 0.05), transparent 40%);
            font-family: "Source Sans 3", sans-serif;
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 56px 20px;
        }

        :focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 2px;
        }

        /* ---------- Ticket ---------- */
        .ticket {
            width: 100%;
            max-width: 520px;
            background: var(--card);
            border: 1px solid var(--card-edge);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }

        .ticket::before,
        .ticket::after {
            content: "";
            display: block;
            height: 16px;
            background-image: radial-gradient(circle, var(--bg) 3px, transparent 3.5px);
            background-size: 22px 16px;
            background-position: center;
            background-color: #0d0d13;
        }

        .form-panel {
            padding: 40px 44px 36px;
        }

        .top-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 4px;
        }

        h1 {
            font-family: "Oswald", sans-serif;
            font-weight: 600;
            font-size: 1.9rem;
            letter-spacing: 0.02em;
            margin: 0;
            color: var(--text);
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin: 0 0 28px;
            border-bottom: 1px solid var(--card-edge);
            padding-bottom: 24px;
        }

        .mensaje {
            margin: 0 0 24px;
            padding: 10px 14px;
            border: 1px solid var(--card-edge);
            border-left: 3px solid var(--gold);
            border-radius: 3px;
            background: var(--field);
            font-size: 0.92rem;
            color: var(--text);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        input[type="text"] {
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text);
            background: var(--field);
            border: 1px solid var(--card-edge);
            border-radius: 3px;
            padding: 10px 12px;
            width: 100%;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        ::placeholder { color: #7d7890; opacity: 1; }

        input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212, 169, 79, 0.15);
        }

        /* El borde rojo aparece solo después de que la persona interactuó con el campo */
        input:user-invalid {
            border-color: var(--danger);
        }

        /* ---------- Botones ---------- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: "Oswald", sans-serif;
            font-size: 0.9rem;
            letter-spacing: 0.03em;
            padding: 12px 22px;
            border: 1px solid transparent;
            border-radius: 3px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            white-space: nowrap;
            transition: filter 0.12s ease, border-color 0.15s ease, color 0.15s ease, background-color 0.15s ease;
        }
        .btn--sm { font-size: 0.8rem; padding: 8px 16px; }

        .btn--primary {
            background: var(--gold);
            color: #1b1607;
        }
        .btn--primary:hover { filter: brightness(1.08); }

        .btn--ghost {
            background: transparent;
            color: var(--text-muted);
            border-color: var(--card-edge);
        }
        .btn--ghost:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .btn--danger {
            background: transparent;
            color: var(--danger-text);
            border-color: var(--danger);
        }
        .btn--danger:hover { background: rgba(192, 85, 74, 0.12); }

        .btn:disabled {
            opacity: 0.6;
            cursor: wait;
            filter: none;
        }

        .actions {
            display: flex;
            gap: 14px;
            margin-top: 8px;
        }
        .actions .btn { flex: 1; }

        @media (max-width: 700px) {
            body { padding: 32px 14px; }
            .form-panel { padding: 30px 22px 28px; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
  </head>

  <body>
    <div class="ticket">
      <div class="form-panel">
        <div class="top-row">
          <h1>Agregar tipo</h1>
          <a class="btn btn--ghost btn--sm" href="/">Inicio</a>
        </div>
        <p class="subtitle">Los tipos te permiten filtrar y organizar las películas del catálogo.</p>

        {% if mensaje %}
        <div class="mensaje" role="status">{{ mensaje }}</div>
        {% endif %}

        <form id="formTipo" action="/agregarTipo/" method="post">
          {% csrf_token %}

          <div class="field">
            <label for="nombre">Nombre</label>
            <input id="nombre" name="nombre" type="text" autocomplete="off" placeholder="Nombre del tipo" required autofocus />
          </div>

          <div class="actions">
            <button type="submit" id="btnGuardar" class="btn btn--primary">Guardar tipo</button>
            <a class="btn btn--danger" href="/">Cancelar</a>
          </div>
        </form>
      </div>
    </div>

    <script>
      (function () {
        var form = document.getElementById("formTipo");
        var btn = document.getElementById("btnGuardar");

        // Evitar envíos dobles
        form.addEventListener("submit", function () {
          btn.disabled = true;
          btn.textContent = "Guardando…";
        });
        // Si vuelven con el botón "atrás", reactivar el botón
        window.addEventListener("pageshow", function (e) {
          if (e.persisted) {
            btn.disabled = false;
            btn.textContent = "Guardar tipo";
          }
        });
      })();
    </script>
  </body>
</html>
